import os, requests, time, sys
BOT_TOKEN=os.getenv("BOT_TOKEN")
CHAT_ID=os.getenv("CHAT_ID")
print(f"TOKEN exists: {bool(BOT_TOKEN)} len={len(BOT_TOKEN) if BOT_TOKEN else 0}", flush=True)
print(f"CHAT_ID exists: {bool(CHAT_ID)} value={CHAT_ID}", flush=True)

def send(m):
    try:
        url=f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
        r=requests.get(url, params={"chat_id": CHAT_ID, "text": m}, timeout=20)
        print(f"Telegram response: {r.status_code} {r.text}", flush=True)
    except Exception as e:
        print(f"Send error: {e}", flush=True)

send("تم ✅ البوت الجديد شغال")
print("Sleeping 1 hour...", flush=True)
time.sleep(3600)
